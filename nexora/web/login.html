<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – NEXORA AI</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .login { max-width: 400px; margin: 14vh auto 0; padding: 0 16px; }
  .login .panel { padding: 28px; }
  .gbtn { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-top: 8px; }
</style>
</head>
<body>
<main class="login">
  <div class="brand" style="padding-left:0"><span class="mark" aria-hidden="true"></span>NEXORA</div>
  <div class="panel">
    <h1>Sign in</h1>
    <p class="muted">Only Google accounts on this NEXORA's allowed list can open it. Your AI still runs entirely on this computer.</p>
    <div id="err" class="warn err" hidden></div>
    <a class="btn primary gbtn" href="/auth/login">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Sign in with Google</a>
  </div>
</main>
<script src="/static/i18n.js"></script>
<script>
  const e = new URLSearchParams(location.search).get("error");
  if (e) { const el = document.getElementById("err"); el.textContent = tr("Sign-in failed:") + " " + e; el.hidden = false; }
</script>
</body>
</html>
